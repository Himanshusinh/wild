name: Build & Deploy — Wild Frontend

on:
  push:
    branches:
      - staging

env:
  ECR_REGISTRY: 213128717650.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: wild
  IMAGE_TAG: staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Write .env.production
        env:
          WILD_ENV_STAGING: ${{ secrets.WILD_ENV_STAGING }}
        run: |
          if [ -z "$WILD_ENV_STAGING" ]; then
            echo "❌ ERROR: WILD_ENV_STAGING secret is empty or not set!"
            exit 1
          fi
          printf '%s' "$WILD_ENV_STAGING" > .env.production
          echo "✅ .env.production written ($(wc -l < .env.production) lines)"

      - name: Validate NEXT_PUBLIC_API_BASE_URL format
        shell: bash
        run: |
          API_BASE="$(awk -F= '/^NEXT_PUBLIC_API_BASE_URL=/{print substr($0, index($0,$2)); exit}' .env.production | tr -d '\r' | xargs)"
          if [ -z "$API_BASE" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_API_BASE_URL missing in .env.production"
            exit 1
          fi
          if [[ ! "$API_BASE" =~ ^https?:// ]]; then
            echo "❌ ERROR: NEXT_PUBLIC_API_BASE_URL must include protocol (http:// or https://). Current: $API_BASE"
            exit 1
          fi
          echo "✅ NEXT_PUBLIC_API_BASE_URL format looks valid: $API_BASE"

      - name: Validate NEXT_PUBLIC_CANVAS_URL format
        shell: bash
        run: |
          CANVAS_URL="$(awk -F= '/^NEXT_PUBLIC_CANVAS_URL=/{print substr($0, index($0,$2)); exit}' .env.production | tr -d '\r' | xargs)"
          if [ -z "$CANVAS_URL" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_CANVAS_URL missing in .env.production"
            exit 1
          fi
          if [[ ! "$CANVAS_URL" =~ ^https?:// ]]; then
            echo "❌ ERROR: NEXT_PUBLIC_CANVAS_URL must include protocol (http:// or https://). Current: $CANVAS_URL"
            exit 1
          fi
          echo "✅ NEXT_PUBLIC_CANVAS_URL format looks valid: $CANVAS_URL"

      - name: Build & Push to ECR
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "✅ Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            export AWS_DEFAULT_REGION=ap-south-1
            cd ~/wildmind-staging/api-gateway-services-wildmind/deployment
            chmod +x deploy.sh
            ./deploy.sh wild